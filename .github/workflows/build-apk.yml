
name: Mini Pvb APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiniPvb_Android_Studio_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q MiniPvb_Android_Studio_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MiniPvb
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Pvb-APK
          path: extracted/MiniPvb/app/build/outputs/apk/debug/app-debug.apk
